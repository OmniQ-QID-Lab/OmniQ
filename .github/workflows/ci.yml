name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build check
        run: python tools/build.py --check
      - name: Integrity and CLI tests
        run: |
          python tests/test_provenance.py
          python tests/test_cli.py
      - name: Offline suite
        run: bash tests/run_all.sh
      - name: Proxy tests
        run: |
          cd infra/proxy/tests
          python test_proxy.py
          python test_start_proxy.py
          bash test_retry.sh
